<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de Insumos - Triagem</title>
    <!-- Vinculando o CSS Externo Separado -->
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="card-form">
        <a href="/" class="back-nav">⬅️ Painel Principal</a>
        <h1>Módulo de Triagem (RF01)</h1>
        
        {% if erro %}
            <div class="error-container" role="alert">{{ erro }}</div>
        {% endif %}

        <form action="/cadastro/salvar" method="POST">
            <div class="form-group">
                <label for="nome">Nome do Insumo Arrecadado:</label>
                <input type="text" id="nome" name="nome" required placeholder="Ex: Feijão Preto Carioca">
            </div>
            <div class="form-group">
                <label for="quantidade">Quantidade do Lote:</label>
                <input type="number" id="quantidade" name="quantidade" required placeholder="Ex: 120">
            </div>
            <div class="form-group">
                <label for="categoria">Categoria Operacional:</label>
                <select id="categoria" name="categoria" required>
                    <option value="Alimentos">Alimentos Perecíveis/Cesta</option>
                    <option value="Higiene">Higiene Pessoal</option>
                    <option value="Vestuário">Vestuário/Agasalhos</option>
                </select>
            </div>
            <div class="form-group">
                <label for="data_validade">Data de Vencimento do Lote:</label>
                <input type="date" id="data_validade" name="data_validade" required>
            </div>
            <button type="submit" class="btn-save">Confirmar e Persistir Registro</button>
        </form>
    </div>
</body>
</html>
